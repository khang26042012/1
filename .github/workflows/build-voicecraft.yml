name: Build VoiceCraft Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'VoiceCraft version tag'
        required: true
        default: 'v1.7.1'
      push:
        description: 'Push to registry (true/false)'
        required: false
        default: 'true'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event.inputs.push == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/khang26042012/voicecraft-server:${{ inputs.version }}
            ghcr.io/khang26042012/voicecraft-server:latest
          build-args: |
            VERSION=${{ inputs.version }}
          platforms: linux/amd64

      - name: Build only (no push)
        if: github.event.inputs.push != 'true'
        run: |
          docker build -t voicecraft-server:${{ inputs.version }} --build-arg VERSION=${{ inputs.version }} .
          docker save voicecraft-server:${{ inputs.version }} | gzip > voicecraft-image.tar.gz
          ls -la voicecraft-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicecraft-image-${{ inputs.version }}
          path: voicecraft-image.tar.gz
          retention-days: 3
